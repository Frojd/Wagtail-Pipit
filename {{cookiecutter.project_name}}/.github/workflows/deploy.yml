{% raw -%}
name: Deploy
run-name: "${{ format('Deploy to {0} ({1})', inputs.environment || 'auto', inputs.ref || github.ref_name) }}"

on:
  workflow_call:
    secrets:
      SSH_DEPLOY_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
      NEXT_PUBLIC_SENTRY_DSN:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Git ref to deploy (tag, branch, or SHA). Leave empty for current branch.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-26.04
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.scss') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Configure Sentry environment
        working-directory: frontend
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
        run: |
          echo "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" >> .env

          if [ "$BRANCH" == "develop" ]; then
            echo "SENTRY_ENVIRONMENT=stage" >> .env
            echo "SENTRY_RELEASE=develop-${BRANCH}" >> .env
          fi

          if [[ "$BRANCH" == v* ]]; then
            echo "SENTRY_ENVIRONMENT=prod" >> .env
            echo "SENTRY_RELEASE=${BRANCH}" >> .env
          fi

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend

      - name: Prune dev dependencies
        run: npm prune --omit=dev
        working-directory: frontend

      - name: Remove non-deployment files
        run: |
          rm -rf .next/cache
          rm -rf stories .storybook __mocks__ __tests__ cli
          rm -f jest.config.ts setupTests.ts .prettierrc.mts .prettierignore
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-build
          path: frontend/
          include-hidden-files: true

  build-backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Upload src build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: src-build
          path: src/

  deploy-staging:
    runs-on: ubuntu-26.04
    needs: [build-frontend, build-backend]
    if: >-
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: {% endraw %}https://{{cookiecutter.domain_stage}}{% raw %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          enable-cache: true
          cache-dependency-glob: "deploy/uv.lock"
          python-version: '3.14'

      - name: Download backend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: src-build
          path: src/

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: frontend-build
          path: frontend/

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install Ansible and Ansistrano
        run: |
          uv sync --project deploy --frozen
          echo "$PWD/deploy/.venv/bin" >> $GITHUB_PATH
          cd deploy
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Move frontend into src
        run: mv frontend src

      - name: Deploy to staging
        run: |
          cd deploy
          ansible-playbook deploy.yml -i stages/stage.yml

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..30}; do
            if curl -sf -o /dev/null --max-time 10 {% endraw %}https://{{cookiecutter.domain_stage}}{% raw %}/wt/health-check/; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

  dast:
    runs-on: ubuntu-26.04
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: .zap

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: {% endraw %}https://{{cookiecutter.domain_stage}}{% raw %}
          cmd_options: '-j -m 1 -d 1'
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: zap-report
          path: report_html.html

  deploy-production:
    runs-on: ubuntu-26.04
    needs: [build-frontend, build-backend, dast]
    if: >-
      !cancelled() &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: {% endraw %}https://{{cookiecutter.domain_prod}}{% raw %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          enable-cache: true
          cache-dependency-glob: "deploy/uv.lock"
          python-version: '3.14'

      - name: Download backend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: src-build
          path: src/

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: frontend-build
          path: frontend/

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install Ansible and Ansistrano
        run: |
          uv sync --project deploy --frozen
          echo "$PWD/deploy/.venv/bin" >> $GITHUB_PATH
          cd deploy
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Move frontend into src
        run: mv frontend src

      - name: Deploy to production
        run: |
          cd deploy
          ansible-playbook deploy.yml -i stages/prod.yml

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..30}; do
            if curl -sf -o /dev/null --max-time 10 {% endraw %}https://{{cookiecutter.domain_prod}}{% raw %}/wt/health-check/; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
{% endraw %}
