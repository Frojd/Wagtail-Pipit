{% raw -%}
name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"
          python-version: '3.14'

      - name: Install Python dependencies
        run: cd src && uv sync --frozen --group dev

      - name: Lint with ruff
        run: |
          cd src
          uv run ruff check

      - name: Check formatting
        run: |
          cd src
          uv run ruff format --check .

      - name: Run mypy
        run: |
          cd src
          uv run mypy .
        env:
          SECRET_KEY: typecheck-secret-key
          ALLOWED_HOSTS: localhost
          DATABASE_NAME: typecheck
          DATABASE_USER: typecheck
          DATABASE_PASSWORD: typecheck
          DATABASE_HOST: localhost
          MEDIA_PATH: /tmp/media
          STATIC_PATH: /tmp/static

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: frontend
        env:
          JEST_JUNIT_OUTPUT_DIR: ../test-results/jest/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jest-test-results
          path: test-results/jest/

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"
          python-version: '3.14'

      - name: Install Python dependencies
        run: cd src && uv sync --frozen --group dev

      - name: Run tests
        run: |
          mkdir -p test-results/pytest
          cd src
          uv run pytest -c pytest.github.ini --durations 10 --junitxml=../test-results/pytest/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-test-results
          path: test-results/pytest/

  security-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yaml
          scanners: "vuln,misconfig,secret"
          exit-code: "1"
          format: "table"

  security-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          python-version: '3.14'

      - name: Audit GitHub Actions workflows
        run: uv run --project .github/tools --frozen --only-group zizmor zizmor --min-confidence medium .

  security-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          python-version: '3.14'

      - name: Audit Python dependencies
        run: |
          audit() { uv run --project .github/tools --frozen --only-group pip-audit pip-audit -r /dev/stdin; }
          uv export --project src --frozen --no-dev | audit
          uv export --project deploy --frozen | audit
          uv export --project .github/tools --frozen --all-groups | audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  deploy:
    needs: [lint-frontend, lint-backend, test-frontend, test-backend, security-sca, security-iac, security-deps]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    uses: $/.github/workflows/deploy.yml
    secrets:
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
{% endraw %}
