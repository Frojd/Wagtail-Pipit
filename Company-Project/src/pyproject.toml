[project]
name = "company_project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.1",
    "gunicorn==26.2.0",
    "gevent==26.9.0",
    "psycopg==3.3.6",
    "python-dotenv==1.2.3",
    "sentry_sdk[django]==2.69.2",
    "wagtail==8.0",
    "wagtail-meta-preview==4.2.1",
    "wagtail_headless_preview==0.9.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
test = [
    "coverage",
    "pytest~=9.1.1",
    "pytest-django==4.14.0",
    "pytest-env",
    "wagtail-factories==4.5.0",
]
dev = [
    {include-group = "test"},
    "django-debug-toolbar",
    "django-stubs==6.1.1",
    "djangorestframework-stubs==3.18.1",
    "mypy==2.3.1",
    "debugpy",
    "ruff==0.16.8",
]
prod = []
stage = []

[tool.uv]
package = false

[tool.ruff]
line-length = 88

exclude = [
    "venv",
    "*/migrations/*",
    "node_modules",
]

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
# RUF012: mutable class attributes are the Django/DRF idiom (Meta.fields, panels).
ignore = ["E501", "RUF012"]
# Enable isort rules for import sorting
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# T100: debugpy is wired up on purpose for VS Code remote debugging.
"manage.py" = ["T100"]
"pipit/settings/dev.py" = ["F405", "F403"]
"pipit/settings/test.py" = ["F405", "F403"]
"pipit/settings/stage.py" = ["F405", "F403"]
"pipit/settings/prod.py" = ["F405", "F403"]
