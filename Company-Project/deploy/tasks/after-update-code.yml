- name: Symlink Django .env
  file:
    src: "{{ ansistrano_shared_path }}/.env"
    dest: "{{ ansistrano_release_path.stdout }}/src/.env"
    state: link

- name: Symlink Next .env
  file:
    src: "{{ ansistrano_shared_path }}/.env.next"
    dest: "{{ ansistrano_release_path.stdout }}/src/frontend/.env.local"
    state: link

- name: Symlink media
  file:
    src: "{{ ansistrano_shared_path }}/media"
    dest: "{{ ansistrano_release_path.stdout }}/src/media"
    state: link

- name: Download uv
  get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-{{ ansible_architecture }}-unknown-linux-gnu.tar.gz"
    dest: "/tmp/uv-{{ uv_version }}-{{ ansible_architecture }}.tar.gz"
    checksum: "sha256:{{ uv_sha256[ansible_architecture] }}"

- name: Create uv bin dir
  file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory

- name: Install uv
  unarchive:
    src: "/tmp/uv-{{ uv_version }}-{{ ansible_architecture }}.tar.gz"
    dest: "{{ ansible_env.HOME }}/.local/bin"
    remote_src: true
    extra_opts: ["--strip-components=1"]

- name: Install dependencies in virtualenv
  shell: >
    cd {{ ansistrano_release_path.stdout }}/src &&
    {{ ansible_env.HOME }}/.local/bin/uv sync --frozen
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ ansistrano_shared_path }}/venv"

- name: Run Migrations
  shell: "{{ ansistrano_shared_path }}/venv/bin/python {{ ansistrano_release_path.stdout }}/src/manage.py migrate --noinput"

- name: Update wagtail search index
  shell: "{{ ansistrano_shared_path }}/venv/bin/python {{ ansistrano_release_path.stdout }}/src/manage.py update_index"

