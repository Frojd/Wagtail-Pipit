name: Test cookiecutter scaffolder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          python-version: '3.14'

      - name: Audit GitHub Actions workflows
        run: uv run --project .github/tools --frozen --only-group zizmor zizmor --min-confidence medium .

  security-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          python-version: '3.14'

      - name: Check that every uv lock matches its pyproject
        run: |
          for project in .github/tools Company-Project/src Company-Project/.github/tools Company-Project/deploy; do
            uv lock --check --project "$project"
          done

      - name: Check that template locks match the generated project
        run: |
          for lock in src/uv.lock .github/tools/uv.lock deploy/uv.lock; do
            cmp "{{cookiecutter.project_name}}/$lock" "Company-Project/$lock"
          done

      - name: Audit Python dependencies
        run: |
          audit() { uv run --project .github/tools --frozen --only-group pip-audit pip-audit -r /dev/stdin; }
          uv export --project Company-Project/src --frozen --no-dev | audit
          uv export --project Company-Project/deploy --frozen | audit
          uv export --project .github/tools --frozen --all-groups | audit
          uv export --project Company-Project/.github/tools --frozen --all-groups | audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: Company-Project/frontend

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experimental_use_app_router: [
          {name: "Page router", value: "False"},
          {name: "App router", value: "True"},
        ]
    name: Test ${{ matrix.experimental_use_app_router.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.5'
          checksum: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'
          python-version: '3.14'

      - name: Cleanup
        run: |
          set -x
          rm -rf Company-Project

      - name: Run cookiecutter
        run: |
          uv run --project .github/tools --frozen --only-group cookiecutter cookiecutter . --no-input experimental_use_app_router=${{ matrix.experimental_use_app_router.value }}

      - name: Create docker compose config for running boilerplate tests
        run: |
          cp docker-compose-ci.yml Company-Project/docker-compose-ci.yml

      - name: Build image
        run: |
          cd Company-Project
          chmod +x src/docker-entrypoint.sh
          docker compose -f docker-compose-ci.yml build

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frojd/wagtail_pipit_python
          trivy-config: trivy.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy uv packages scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Company-Project/src
          trivy-config: trivy.yaml
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Verify backend scaffolder
        run: |
          cd Company-Project
          set -x
          docker compose -f docker-compose-ci.yml run --rm python bash -c "python manage.py new_page --name=Article && ruff check ."

      - name: Run tests on container
        run: |
          cd Company-Project
          docker compose -f docker-compose-ci.yml run --rm python test
          docker compose -f docker-compose-ci.yml run --rm python typecheck
          docker compose -f docker-compose-ci.yml run --rm python lint

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Run frontend tests
        env:
          IGNORE_SENTRY: 1
        run: |
          cd Company-Project/frontend
          npm ci
          npm run lint
          npm run fixcode:check
          npm run test:ci
          NODE_ENV=production npm run build
          npm run build-storybook
