name: Test cookiecutter scaffolder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: '3.14'

      - name: Audit GitHub Actions workflows
        run: uvx zizmor==1.25.2 --min-confidence medium .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experimental_use_app_router: [
          {name: "Page router", value: "False"},
          {name: "App router", value: "True"},
        ]
    name: Test ${{ matrix.experimental_use_app_router.name }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          python-version: '3.14'

      - name: Install cookiecutter
        run: uv tool install cookiecutter

      - name: Cleanup
        run: |
          set -x
          rm -rf Company-Project

      - name: Run cookiecutter
        run: |
          uvx cookiecutter . --no-input experimental_use_app_router=${{ matrix.experimental_use_app_router.value }}

      - name: Create docker compose config for running boilerplate tests
        run: |
          cp docker-compose-ci.yml Company-Project/docker-compose-ci.yml

      - name: Build image
        run: |
          cd Company-Project
          chmod +x src/docker-entrypoint.sh
          docker compose -f docker-compose-ci.yml build

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frojd/wagtail_pipit_python
          trivy-config: trivy.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy uv packages scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Company-Project/src
          trivy-config: trivy.yaml
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Verify backend scaffolder
        run: |
          cd Company-Project
          set -x
          docker compose -f docker-compose-ci.yml run --rm python python manage.py new_page --name=Article

      - name: Run tests on container
        run: |
          cd Company-Project
          docker compose -f docker-compose-ci.yml run --rm python test
          docker compose -f docker-compose-ci.yml run --rm python typecheck
          docker compose -f docker-compose-ci.yml run --rm python lint

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"

      - name: Run frontend tests
        env:
          IGNORE_SENTRY: 1
        run: |
          cd Company-Project/frontend
          npm ci
          npm run test:ci
          NODE_ENV=production npm run build
          npm run build-storybook
